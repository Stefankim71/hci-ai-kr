<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HCI.AI.KR — Where HCI Meets AI</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020914}
body{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.intro{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  min-height:100dvh;
  background:#020914;
  z-index:9999;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  transition:opacity .9s ease,visibility .9s ease;
}
.intro.hide{opacity:0;visibility:hidden;pointer-events:none}

/* Chrome/mobile safe sizing: never let the 16:9 video exceed the viewport. */
.intro-video{
  display:block;
  width:100%;
  height:100%;
  max-width:100%;
  max-height:100%;
  object-fit:contain;
  object-position:center center;
  background:#020914;
}

.skip{
  position:absolute;
  right:max(24px,env(safe-area-inset-right));
  bottom:max(24px,env(safe-area-inset-bottom));
  z-index:3;
  padding:11px 16px;
  border:1px solid rgba(255,255,255,.25);
  border-radius:999px;
  background:rgba(2,9,20,.62);
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
  color:#eaf0fb;
  font-size:13px;
  font-weight:700;
  letter-spacing:.08em;
  cursor:pointer;
}
.skip:hover{background:rgba(255,255,255,.09);border-color:rgba(255,255,255,.4)}

.play{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  z-index:4;
  display:none;
  padding:15px 22px;
  border:1px solid rgba(255,255,255,.3);
  border-radius:999px;
  background:rgba(2,9,20,.72);
  color:#fff;
  font-size:15px;
  font-weight:800;
  cursor:pointer;
}
.play.show{display:block}

.fallback{
  position:absolute;
  inset:0;
  z-index:2;
  display:none;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  gap:18px;
  color:#fff;
  background:linear-gradient(180deg,#102a52,#020914);
}
.fallback strong{font-size:clamp(38px,7vw,82px);letter-spacing:-.05em}
.fallback span{color:#b7ff00;font-size:18px}

@media(max-width:600px){
  .intro-video{width:100%;height:100%;object-fit:contain}
  .skip{
    right:max(16px,env(safe-area-inset-right));
    bottom:max(16px,env(safe-area-inset-bottom));
    padding:10px 14px;
    font-size:12px;
  }
}
@media(prefers-reduced-motion:reduce){.intro{display:none}}
</style>
</head>
<body>
<div class="intro" id="intro">
  <video
    id="introVideo"
    class="intro-video"
    autoplay
    muted
    playsinline
    webkit-playsinline
    preload="auto"
    poster="poster.png"
    disablepictureinpicture
  >
    <source src="intro.mp4?v=2" type="video/mp4">
  </video>

  <button class="play" id="play" type="button">PLAY INTRO →</button>
  <button class="skip" id="skip" type="button">SKIP INTRO →</button>

  <div class="fallback" id="fallback">
    <strong>HCI.AI.KR</strong>
    <span>Where HCI Meets AI</span>
  </div>
</div>

<script>
(() => {
  const intro = document.getElementById('intro');
  const video = document.getElementById('introVideo');
  const skip = document.getElementById('skip');
  const play = document.getElementById('play');
  const fallback = document.getElementById('fallback');

  let entered = false;
  let errorTimer = null;

  function enterSite() {
    if (entered) return;
    entered = true;
    intro.classList.add('hide');
    window.setTimeout(() => {
      window.location.replace('main.html');
    }, 900);
  }

  function showPlayButton() {
    if (!entered) play.classList.add('show');
  }

  function tryPlay() {
    video.muted = true;
    video.defaultMuted = true;
    video.setAttribute('muted', '');
    video.setAttribute('playsinline', '');
    video.setAttribute('webkit-playsinline', '');

    const result = video.play();
    if (result && typeof result.catch === 'function') {
      result.catch(() => showPlayButton());
    }
  }

  skip.addEventListener('click', enterSite);

  play.addEventListener('click', () => {
    play.classList.remove('show');
    tryPlay();
  });

  video.addEventListener('ended', enterSite);

  video.addEventListener('loadedmetadata', () => {
    /* Re-apply the viewport constraints after Chrome knows the video size. */
    video.style.maxWidth = '100%';
    video.style.maxHeight = '100%';
  });

  video.addEventListener('canplay', () => {
    if (!entered) tryPlay();
  });

  video.addEventListener('playing', () => {
    play.classList.remove('show');
    if (errorTimer) {
      clearTimeout(errorTimer);
      errorTimer = null;
    }
  });

  video.addEventListener('error', () => {
    if (errorTimer) clearTimeout(errorTimer);
    errorTimer = setTimeout(() => {
      fallback.style.display = 'flex';
      setTimeout(enterSite, 1800);
    }, 250);
  });

  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
    enterSite();
    return;
  }

  window.addEventListener('load', tryPlay, {once:true});
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden && video.paused && !entered) tryPlay();
  });

  /* Chrome mobile viewport changes, including address-bar expansion/collapse. */
  const resizeVideo = () => {
    video.style.width = '100%';
    video.style.height = '100%';
  };
  window.addEventListener('resize', resizeVideo, {passive:true});
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', resizeVideo, {passive:true});
  }

  tryPlay();
})();
</script>
</body>
</html>
