<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HCI.AI.KR — Where HCI Meets AI</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020914;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.intro{position:fixed;inset:0;background:#020914;z-index:10;transition:opacity 1.1s ease,visibility 1.1s ease}
.intro.hide{opacity:0;visibility:hidden;pointer-events:none}
video{width:100%;height:100%;object-fit:cover;display:block}
.skip{position:absolute;right:30px;bottom:28px;padding:11px 16px;border:1px solid rgba(255,255,255,.22);border-radius:999px;background:rgba(2,9,20,.52);backdrop-filter:blur(10px);color:#eaf0fb;font-size:13px;font-weight:700;letter-spacing:.08em;cursor:pointer}
.skip:hover{background:rgba(255,255,255,.09);border-color:rgba(255,255,255,.4)}
.fallback{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:18px;color:#fff;background:linear-gradient(180deg,#102a52,#020914)}
.fallback strong{font-size:clamp(38px,7vw,82px);letter-spacing:-.05em}.fallback span{color:#b7ff00;font-size:18px}
@media(prefers-reduced-motion:reduce){.intro{display:none}}
</style>
</head>
<body>
<div class="intro" id="intro">
  <video id="introVideo" autoplay muted playsinline preload="auto" poster="poster.png">
    <source src="intro.mp4" type="video/mp4">
  </video>
  <button class="skip" id="skip">SKIP INTRO →</button>
</div>
<div class="fallback" id="fallback" style="display:none">
  <strong>HCI.AI.KR</strong>
  <span>Where HCI Meets AI</span>
</div>
<script>
const intro=document.getElementById('intro');
const video=document.getElementById('introVideo');
const skip=document.getElementById('skip');
function enterSite(){
  intro.classList.add('hide');
  setTimeout(()=>{window.location.href='main.html'},950);
}
skip.addEventListener('click',enterSite);
video.addEventListener('ended',enterSite);
video.addEventListener('error',()=>{
  document.getElementById('fallback').style.display='flex';
  setTimeout(enterSite,1800);
});
if(window.matchMedia('(prefers-reduced-motion: reduce)').matches){enterSite();}
</script>
</body>
</html>
