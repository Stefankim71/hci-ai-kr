<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#020914">
<title>HCI.AI.KR — Where HCI Meets AI</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020914;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.intro{position:fixed;inset:0;background:#020914;z-index:10;transition:opacity .85s ease,visibility .85s ease}
.intro.hide{opacity:0;visibility:hidden;pointer-events:none}
video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;background:#020914}
.skip{position:absolute;right:30px;bottom:28px;padding:11px 16px;border:1px solid rgba(255,255,255,.24);border-radius:999px;background:rgba(2,9,20,.62);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:#eaf0fb;font-size:13px;font-weight:700;letter-spacing:.08em;cursor:pointer;z-index:3}
.skip:hover{background:rgba(255,255,255,.09);border-color:rgba(255,255,255,.42)}
.start{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:none;padding:14px 22px;border:1px solid rgba(183,255,0,.55);border-radius:999px;background:rgba(2,9,20,.72);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:#fff;font-size:14px;font-weight:800;letter-spacing:.08em;cursor:pointer;z-index:4}
.start.show{display:block}
.status{position:absolute;left:50%;top:calc(50% + 54px);transform:translateX(-50%);display:none;color:rgba(255,255,255,.72);font-size:12px;letter-spacing:.04em;z-index:4;white-space:nowrap}
.status.show{display:block}
.fallback{position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;gap:18px;color:#fff;background:linear-gradient(180deg,#102a52,#020914);z-index:2}
.fallback strong{font-size:clamp(38px,7vw,82px);letter-spacing:-.05em}.fallback span{color:#b7ff00;font-size:18px}
@media(max-width:700px){.skip{right:18px;bottom:18px}.start{font-size:13px}.status{top:calc(50% + 48px)}}
@media(prefers-reduced-motion:reduce){.intro{display:none}}
</style>
</head>
<body>
<div class="intro" id="intro">
  <video id="introVideo" autoplay muted playsinline webkit-playsinline preload="auto" poster="poster.png" aria-label="HCI.AI.KR intro video">
    <source src="intro.mp4?v=2" type="video/mp4">
  </video>
  <button class="start" id="start" type="button">ENTER INTRO →</button>
  <div class="status" id="status">영상 준비 중...</div>
  <button class="skip" id="skip" type="button">SKIP INTRO →</button>
  <div class="fallback" id="fallback">
    <strong>HCI.AI.KR</strong>
    <span>Where HCI Meets AI</span>
  </div>
</div>
<script>
(function(){
  const intro=document.getElementById('intro');
  const video=document.getElementById('introVideo');
  const skip=document.getElementById('skip');
  const start=document.getElementById('start');
  const status=document.getElementById('status');
  const fallback=document.getElementById('fallback');
  let entered=false;

  function enterSite(){
    if(entered)return;
    entered=true;
    intro.classList.add('hide');
    setTimeout(function(){window.location.replace('main.html');},900);
  }

  function showStart(){
    if(entered)return;
    start.classList.add('show');
    status.classList.remove('show');
  }

  function tryPlay(){
    if(entered)return;
    video.muted=true;
    video.defaultMuted=true;
    const p=video.play();
    if(p && typeof p.catch==='function'){
      p.catch(function(){showStart();});
    }
  }

  skip.addEventListener('click',enterSite);
  start.addEventListener('click',function(){
    start.classList.remove('show');
    status.classList.add('show');
    video.muted=true;
    const p=video.play();
    if(p && typeof p.catch==='function'){
      p.then(function(){status.classList.remove('show');})
       .catch(function(){status.textContent='재생을 시작할 수 없습니다.';});
    }
  });

  video.addEventListener('ended',enterSite);
  video.addEventListener('canplay',function(){tryPlay();});
  video.addEventListener('loadeddata',function(){tryPlay();});
  video.addEventListener('error',function(){
    start.classList.remove('show');
    status.classList.remove('show');
    fallback.style.display='flex';
    setTimeout(enterSite,1800);
  });

  if(window.matchMedia('(prefers-reduced-motion: reduce)').matches){
    enterSite();
    return;
  }

  // Chrome 등에서 autoplay가 막혀도 첫 로딩 직후 재생을 한 번 더 시도합니다.
  if(document.readyState==='loading'){
    document.addEventListener('DOMContentLoaded',tryPlay,{once:true});
  }else{
    tryPlay();
  }
})();
</script>
</body>
</html>
